name: "Build and Publish"

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package directories to rebuild (empty = all)"
        required: false
        default: ""
      aur:
        description: "Push whitelisted packages to the AUR"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate matrix
        id: gen-matrix
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.packages }}
          # Empty on a push, so only an explicit "false" turns AUR pushes off.
          PUSH_AUR: ${{ github.event.inputs.aur }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parse_aur() { sed -e 's/^[[:space:]]*//' -e 's/#.*//' -e 's/[[:space:]]*$//' | grep -v '^$'; }
          mapfile -t aur < <(parse_aur < aur-packages.txt)
          for p in "${aur[@]}"; do
            if [ ! -f "$p/PKGBUILD" ]; then
              echo "::error::aur-packages.txt entry has no PKGBUILD: $p"
              exit 1
            fi
          done

          # Diff against the last fully successful push rather than this push's
          # parent: a pending run replaced in the concurrency queue, a failed
          # build or an AUR outage is then retried by the next push.
          base=""
          scope=all
          if [ "$EVENT" = "push" ]; then
            if ! base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/push_aur.yml/runs?branch=master&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty'); then
              echo "::error::could not read the last successful run"
              exit 1
            fi
            if [ -z "$base" ]; then
              echo "no successful push run found, building everything"
            elif git merge-base --is-ancestor "$base" "$GITHUB_SHA"; then
              echo "diffing against last successful push: $base"
              scope=diff
            elif git merge-base --is-ancestor "$GITHUB_SHA" "$base"; then
              # Re-running an old run must not publish its older tree.
              echo "$GITHUB_SHA is older than the last successful push $base, nothing to do"
              scope=none
            else
              echo "last successful push $base is not in this history, building everything"
            fi
          fi

          candidates=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$REQUESTED" ]; then
            read -r -a candidates <<< "$REQUESTED"
            for p in "${candidates[@]}"; do
              case "$p" in
                */*|.|..)
                  echo "::error::invalid requested package: $p"
                  exit 1
                  ;;
              esac
              if [ ! -f "$p/PKGBUILD" ]; then
                echo "::error::requested package has no PKGBUILD: $p"
                exit 1
              fi
            done
          elif [ "$scope" = "none" ]; then
            :
          elif [ "$scope" = "diff" ]; then
            mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA" | grep -v '/\.nvchecker\.toml$' || true)
            mapfile -t dirs < <(printf '%s\n' "${changed[@]}" | cut -d/ -f1 | sort -u)
            # A push that only edits the whitelist must still build the packages
            # it added, otherwise they never reach the AUR.
            added=()
            if printf '%s\n' "${changed[@]}" | grep -qx 'aur-packages.txt'; then
              mapfile -t old_aur < <(git show "$base:aur-packages.txt" 2>/dev/null | parse_aur || true)
              mapfile -t added < <(comm -13 <(printf '%s\n' "${old_aur[@]}" | sort -u) <(printf '%s\n' "${aur[@]}" | sort -u))
            fi
            mapfile -t candidates < <(
              {
                printf '%s\n' "${dirs[@]}"
                printf '%s\n' "${added[@]}"
              } | grep -v '^$' | sort -u
            )
          else
            mapfile -t candidates < <(find . -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort)
          fi

          build=()
          push=()
          for p in "${candidates[@]}"; do
            [ -f "$p/PKGBUILD" ] || continue
            build+=("$p")
            if [ "$PUSH_AUR" != "false" ] && printf '%s\n' "${aur[@]}" | grep -qxF "$p"; then
              push+=("$p")
            fi
          done

          to_matrix() {
            if [ $# -gt 0 ]; then
              printf '%s\n' "$@" | jq -R '{name: .}' | jq -cs '{include: .}'
            else
              echo '{"include":[]}'
            fi
          }
          {
            echo "count=${#build[@]}"
            echo "matrix=$(to_matrix "${build[@]}")"
            echo "aur_count=${#push[@]}"
            echo "aur_matrix=$(to_matrix "${push[@]}")"
          } >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      count: ${{ steps.gen-matrix.outputs.count }}
      aur_matrix: ${{ steps.gen-matrix.outputs.aur_matrix }}
      aur_count: ${{ steps.gen-matrix.outputs.aur_count }}

  preflight:
    runs-on: ubuntu-latest
    needs: generate-matrix
    # Only pushes to the AUR depend on it, so an AUR outage cannot hold up
    # packages that are served from the personal repository alone.
    if: github.ref == 'refs/heads/master' && needs.generate-matrix.outputs.aur_count != '0'
    steps:
      - uses: actions/checkout@v7

      - name: Install SSH key
        # Pinned to v2 as of 2026-10; bump deliberately.
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Verify AUR maintainership
        run: |
          set -o pipefail
          parse_aur() { sed -e 's/^[[:space:]]*//' -e 's/#.*//' -e 's/[[:space:]]*$//' | grep -v '^$'; }
          mapfile -t listed < <(parse_aur < aur-packages.txt)

          # list-repos prints one package base per line, with a leading space.
          if ! ssh -o BatchMode=yes aur@aur.archlinux.org list-repos |
            awk '{print $1}' | sort -u > /tmp/owned; then
            echo "::error::could not read the AUR package list"
            exit 1
          fi

          owned=0
          new=0
          foreign=0
          for pkg in "${listed[@]}"; do
            if grep -qxF "$pkg" /tmp/owned; then
              owned=$((owned + 1))
              continue
            fi

            # A name that is not on the AUR yet is created by its first push.
            if ! rpc=$(curl -fsS --retry 3 --retry-delay 2 --max-time 20 \
              --get --data-urlencode "arg[]=$pkg" \
              https://aur.archlinux.org/rpc/v5/info); then
              echo "::error::AUR RPC failed while checking $pkg"
              foreign=$((foreign + 1))
              continue
            fi
            if [ "$(jq -r '.resultcount' <<<"$rpc")" = "0" ]; then
              echo "$pkg is not on the AUR yet and will be created"
              new=$((new + 1))
            else
              echo "::error::$pkg exists on the AUR but is not maintained by this account"
              foreign=$((foreign + 1))
            fi
          done

          echo "checked ${#listed[@]} whitelisted packages: ${owned} owned, ${new} new, ${foreign} not owned"
          [ "$foreign" -eq 0 ]

  build:
    runs-on: ubuntu-latest
    needs: generate-matrix
    if: github.ref == 'refs/heads/master' && needs.generate-matrix.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    # Runs upstream build code, so this job must never hold the AUR SSH key.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build package
        env:
          PKG: ${{ matrix.name }}
          # Standard GitHub runners have 4 vCPUs and makepkg defaults to
          # serial builds; this also applies to dependencies built by paru.
          MAKEFLAGS: "-j4"
          # The container's makepkg.conf leaves PACKAGER commented out, which
          # would record every package as "Unknown Packager".
          PACKAGER: "RiverOnVenus <aur@zhui.dev>"
        # Only the package directory and the script are mounted: no checkout,
        # no token and no Docker socket reach the build.
        run: |
          mkdir out
          docker run --rm \
            -e MAKEFLAGS -e PACKAGER \
            -v "$PWD/$PKG:/src:ro" \
            -v "$PWD/.github/scripts/build-package.sh:/build-package.sh:ro" \
            -v "$PWD/out:/out" \
            archlinux:base-devel bash /build-package.sh /src /out

          # Build code runs as root in the container and could leave a symlink
          # to a runner file here; the artifact upload would follow it.
          find out -mindepth 1 ! -type f -print -delete

          # Artifact names cannot contain ':', which an epoch puts in the file
          # name. Release assets get the same name.
          for f in out/*; do
            name=$(basename "$f")
            safe=$(sed -e 's/[^A-Za-z0-9._-]/_/g' <<< "$name")
            [ "$name" = "$safe" ] || mv "$f" "out/$safe"
          done
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.name }}
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 3

  push-aur:
    runs-on: ubuntu-latest
    needs: [generate-matrix, preflight, build]
    # Runs on its own VM, away from build code. Builds may fail individually, so
    # each package checks its own result below.
    if: always() && !cancelled() && github.ref == 'refs/heads/master' &&
      needs.generate-matrix.outputs.aur_count != '0' &&
      needs.preflight.result == 'success'
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      # The AUR closes SSH connections when too many arrive at once.
      max-parallel: 4
      matrix: ${{ fromJson(needs.generate-matrix.outputs.aur_matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit message comes from this package's history.
          fetch-depth: 0
          persist-credentials: false

      - name: Check build result
        id: built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.name }}
        run: |
          total=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=pkg-$PKG" --jq '.total_count')
          if [ "$total" -gt 0 ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "$PKG did not build, not pushing it"
          fi

      # Taken from the committed PKGBUILD without running pkgver(), so a VCS
      # package only reaches the AUR when its packaging changes. This sources
      # the PKGBUILD, so it has to stay ahead of the SSH key.
      - name: Generate .SRCINFO
        if: steps.built.outputs.ok == '1'
        env:
          PKG: ${{ matrix.name }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/$PKG:/pkg" -w /pkg archlinux:base-devel \
            sh -c 'makepkg --printsrcinfo > .SRCINFO'

      - name: Install SSH key
        if: steps.built.outputs.ok == '1'
        # Pinned to v2 as of 2026-10; bump deliberately.
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Clone AUR and update
        if: steps.built.outputs.ok == '1'
        env:
          PKG: ${{ matrix.name }}
        run: |
          message="$(git log -n1 --pretty='%B' "$PKG")"
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" ../aur
          shopt -s dotglob
          shopt -s extglob
          rm ../aur/!(.git|.|..) || true
          cp -r "$PKG"/* ../aur
          # Version-check metadata stays in the repository, not in the AUR.
          rm -f ../aur/.nvchecker.toml
          cd ../aur
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git diff-index @ --exit-code --quiet || ( git commit -m "Update from GitHub Actions: $message

          https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" && echo "::notice::pushed $PKG to the AUR" )
          git push

  publish-repo:
    runs-on: ubuntu-latest
    needs: [generate-matrix, build]
    # Run even when some or all builds failed, and when nothing was built at
    # all, so deletions and whitelist changes are still reconciled.
    if: always() && !cancelled() && github.ref == 'refs/heads/master' &&
      needs.generate-matrix.result == 'success'
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The reconcile step sources every PKGBUILD.
          persist-credentials: false

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pkg-*
          merge-multiple: true
          path: new

      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli jq

      - name: Fetch database
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if gh release view zhui-arch >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            gh release download zhui-arch -p 'zhui-arch.db' -p 'zhui-arch.files' -D . --clobber >/dev/null 2>&1 || true
            [ -f zhui-arch.db ] && mv -f zhui-arch.db zhui-arch.db.tar.gz
            [ -f zhui-arch.files ] && mv -f zhui-arch.files zhui-arch.files.tar.gz

            # An incomplete database would replace the release one, and the
            # prune step would delete every asset it does not list.
            if [ ! -f zhui-arch.db.tar.gz ] || [ ! -f zhui-arch.files.tar.gz ]; then
              echo "::error::could not download the existing database"
              exit 1
            fi
            if ! bsdtar -tf zhui-arch.db.tar.gz >/dev/null 2>&1 ||
              ! bsdtar -tf zhui-arch.files.tar.gz >/dev/null 2>&1; then
              echo "::error::downloaded database is not a valid archive"
              exit 1
            fi
            if ! bsdtar -xOf zhui-arch.db.tar.gz --include='*/desc' |
              awk '/^%NAME%$/{ found = 1 } END { exit !found }'; then
              echo "::error::downloaded database has no package entries"
              exit 1
            fi
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      # No token in this step: it sources every PKGBUILD.
      - name: Reconcile database
        id: reconcile
        run: |
          set -o pipefail
          shopt -s nullglob
          packages=(new/*.pkg.tar.zst)
          changed=0

          if [ -f zhui-arch.db.tar.gz ]; then
            declare -A current=()
            parsed=1
            while IFS= read -r -d '' pkgbuild; do
              names="$(bash -c 'source "$1" >/dev/null 2>&1; printf "%s\n" "${pkgname[@]}"' _ "$pkgbuild")"
              if [ -z "$names" ]; then
                echo "warning: could not read pkgname from $pkgbuild, skipping stale entry cleanup"
                parsed=0
                break
              fi
              while IFS= read -r name; do
                [ -n "$name" ] && current["$name"]=1
              done <<< "$names"
            done < <(find . -mindepth 2 -maxdepth 2 -name PKGBUILD -print0)

            if [ "$parsed" -eq 1 ]; then
              while IFS= read -r name; do
                [ -n "$name" ] || continue
                if [ -z "${current[$name]:-}" ]; then
                  echo "removing stale entry: $name"
                  repo-remove zhui-arch.db.tar.gz "$name" || true
                  changed=1
                fi
              done < <(bsdtar -xOf zhui-arch.db.tar.gz --include='*/desc' | awk '/^%NAME%$/{getline; print}')
            fi
          fi

          if [ ${#packages[@]} -gt 0 ]; then
            repo-add zhui-arch.db.tar.gz "${packages[@]}"
            changed=1
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.reconcile.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          shopt -s nullglob
          packages=(new/*.pkg.tar.zst)

          if [ "${{ steps.fetch.outputs.exists }}" -eq 0 ]; then
            gh release create zhui-arch \
              --title "zhui-arch package repository" \
              --notes "Personal pacman repository.

          Server: ${{ github.server_url }}/${{ github.repository }}/releases/download/zhui-arch"
          fi

          # Upload packages first, the database last, so clients never see a
          # database entry whose package is not downloadable yet.
          if [ ${#packages[@]} -gt 0 ]; then
            gh release upload zhui-arch --clobber "${packages[@]}"
          fi
          gh release upload zhui-arch --clobber ./zhui-arch.db ./zhui-arch.files

          if ! bsdtar -xOf zhui-arch.db.tar.gz --include='*/desc' |
            awk '/^%FILENAME%$/{getline; print}' | sort > /tmp/keep; then
            echo "refusing to prune: could not read the database" >&2
            exit 1
          fi
          if [ ! -s /tmp/keep ]; then
            echo "refusing to prune: database has no entries" >&2
            exit 1
          fi
          printf 'zhui-arch.db\nzhui-arch.files\n' >> /tmp/keep
          sort -o /tmp/keep /tmp/keep
          gh release view zhui-arch --json assets --jq '.assets[].name' | while read -r asset; do
            if ! grep -qxF "$asset" /tmp/keep; then
              echo "deleting stale asset: $asset"
              gh release delete-asset zhui-arch "$asset" --yes
            fi
          done
