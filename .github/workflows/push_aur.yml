name: "Build and Publish"

on:
  push:
  #schedule:
  #- cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix
        id: gen-matrix
        run: |
          mapfile -t aur < <(sed -e 's/#.*//' -e 's/[[:space:]]*$//' aur-packages.txt | grep -v '^$')
          include=()
          for d in */; do
            p=${d%/}
            [ -f "$p/PKGBUILD" ] || continue
            if printf '%s\n' "${aur[@]}" | grep -qxF "$p"; then
              include+=("{\"name\":\"$p\",\"aur\":true}")
            else
              include+=("{\"name\":\"$p\",\"aur\":false}")
            fi
          done
          echo "matrix=$(printf '%s\n' "${include[@]}" | jq -cs '{include: .}')" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}

  build:
    runs-on: ubuntu-latest
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PKGBUILD
        id: build-test
        uses: ouuan/pkgbuild-action@master
        with:
          path: ${{ matrix.name }}

      - name: Handle epoch
        id: epoch
        run: |
          oldname="${{ steps.build-test.outputs.pkgfile }}"
          newname="$(echo "$oldname" | sed -e 's/[^A-Za-z0-9._-]/_/g')"
          if [[ "$oldname" != "$newname" ]]; then
            mv "$oldname" "$newname"
          fi
          echo "pkgfile=$newname" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: ${{ steps.epoch.outputs.pkgfile }}
          retention-days: 3

      - name: Install SSH key
        if: matrix.aur
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Clone AUR and update
        if: matrix.aur
        run: |
          message="$(git log -n1 --pretty='%B' "${{ matrix.name }}")"
          git clone ssh://aur@aur.archlinux.org/${{ matrix.name }}.git ../aur
          shopt -s dotglob
          shopt -s extglob
          rm ../aur/!(.git|.|..) || true
          cp -r ${{ matrix.name }}/*  ../aur
          cd ../aur
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          escape() {
            local content="$1"
            content="${content//'%'/'%25'}"
            content="${content//$'\n'/'%0A'}"
            content="${content//$'\r'/'%0D'}"
            echo "$content"
          }
          git diff-index @ --exit-code --quiet || ( git commit -m "Update from GitHub Actions: $message

          https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}" && echo "::warning::Pushed to AUR:%0A$(escape "$message")" )
          git push

  publish-repo:
    runs-on: ubuntu-latest
    needs: build
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: repo

      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli jq

      - name: Build repository database
        working-directory: repo
        run: |
          shopt -s nullglob
          packages=(*.pkg.tar.zst)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "no packages were built" >&2
            exit 1
          fi
          repo-add zhui-arch.db.tar.gz "${packages[@]}"

      - name: Publish release
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view zhui-arch >/dev/null 2>&1 || \
            gh release create zhui-arch \
              --title "zhui-arch package repository" \
              --notes "Personal pacman repository.

          Server: ${{ github.server_url }}/${{ github.repository }}/releases/download/zhui-arch"

          # Upload packages first, the database last, so clients never see a
          # database entry whose package is not downloadable yet.
          gh release upload zhui-arch --clobber ./*.pkg.tar.zst
          gh release upload zhui-arch --clobber ./zhui-arch.db ./zhui-arch.files

          # Drop assets that are not part of the current repository contents.
          ls -1 | sort > /tmp/keep
          gh release view zhui-arch --json assets --jq '.assets[].name' | while read -r asset; do
            grep -qxF "$asset" /tmp/keep || gh release delete-asset zhui-arch "$asset" --yes
          done
